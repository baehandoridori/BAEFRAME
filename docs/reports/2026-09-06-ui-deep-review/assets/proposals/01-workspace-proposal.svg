<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">공통 작업 화면 제안</title><desc id="desc">구현된 앱이 아닌 화면 구조 제안. 고정 도구와 문맥 행, 선택 속성, 계층형 타임라인을 보여준다.</desc><style>text{font-family:'Segoe UI','Malgun Gothic',sans-serif}</style><rect x="0" y="0" width="1440" height="900" rx="0" fill="#17191d" stroke="none"/><rect x="0" y="0" width="1440" height="40" rx="0" fill="#31302a" stroke="none"/><text x="20" y="27" fill="#f4cb55" font-size="16" font-weight="600">설계 제안 · 미구현   |   공통 작업 구조: 도구는 왼쪽, 작업 대상은 가운데, 선택 속성은 오른쪽</text><rect x="0" y="40" width="1440" height="54" rx="0" fill="#22252a" stroke="none"/><text x="20" y="75" fill="#eef0f4" font-size="20" font-weight="700">B  baeframe</text><rect x="180" y="52" width="116" height="30" rx="4" fill="#514831" stroke="#f4cb55"/><text x="190" y="73" fill="#f4cb55" font-size="13" font-weight="600">영상 제작</text><text x="318" y="75" fill="#eef0f4" font-size="17" font-weight="600">걷기 릴 편집.bedit</text><text x="1020" y="75" fill="#a9d4bc" font-size="13" font-weight="400">✓ 이 기기에 저장됨</text><rect x="1220" y="52" width="196" height="30" rx="4" fill="#2e3239" stroke="#4b515c"/><text x="1230" y="73" fill="#eef0f4" font-size="13" font-weight="400">MP4 내보내기</text><rect x="0" y="94" width="60" height="492" rx="0" fill="#22252a" stroke="none"/><rect x="8" y="112" width="44" height="60" rx="4" fill="#514831" stroke="#f4cb55"/><text x="23" y="139" fill="#f4cb55" font-size="18" font-weight="600">V</text><text x="12" y="159" fill="#f4cb55" font-size="10" font-weight="400">선택</text><rect x="8" y="184" width="44" height="60" rx="4" fill="#22252a" stroke="none"/><text x="23" y="211" fill="#eef0f4" font-size="18" font-weight="600">C</text><text x="12" y="231" fill="#b8bec9" font-size="10" font-weight="400">자르기</text><rect x="8" y="256" width="44" height="60" rx="4" fill="#22252a" stroke="none"/><text x="23" y="283" fill="#eef0f4" font-size="18" font-weight="600">H</text><text x="12" y="303" fill=