 rx="4" fill="#514831" stroke="#f4cb55"/><text x="168" y="571" fill="#f4cb55" font-size="13" font-weight="600">획 전체</text><rect x="293" y="550" width="92" height="30" rx="4" fill="#514831" stroke="#f4cb55"/><text x="303" y="571" fill="#f4cb55" font-size="13" font-weight="600">사각 영역</text><rect x="397" y="550" width="119" height="30" rx="4" fill="#2e3239" stroke="#4b515c"/><text x="407" y="571" fill="#eef0f4" font-size="13" font-weight="400">부분 선택</text><text x="663" y="571" fill="#8fc0ff" font-size="14" font-weight="400">선택한 대상: 컷 02 / 포즈</text><rect x="1080" y="94" width="360" height="492" rx="0" fill="#22252a" stroke="none"/><text x="1100" y="121" fill="#eef0f4" font-size="16" font-weight="600">선택 속성</text><path d="M1080 134H1440" stroke="#4b515c"/><text x="1100" y="164" fill="#8fc0ff" font-size="20" font-weight="600">그림 2개 선택</text><text x="1100" y="189" fill="#b8bec9" font-size="14" font-weight="400">컷 02 · 포즈 레이어 · 24–32F</text><text x="1100" y="232" fill="#b8bec9" font-size="13" font-weight="400">범위</text><rect x="1100" y="246" width="312" height="30" rx="4" fill="#2e3239" stroke="#4b515c"/><text x="1110" y="267" fill="#eef0f4" font-size="13" font-weight="400">이 키프레임의 그림만 변경</text><text x="1100" y="309" fill="#eef0f4" font-size="14" font-weight="600">위치 / 크기</text><rect x="1100" y="327" width="144" height="30" rx="4" fill="#2e3239" stroke="#4b515c"/><text x="1110" y="348" fill="#eef0f4" font-size="13" font-weight="400">X  320</text><rect x="1254" y="327" width="158" height="30" rx="4" fill="#2e3239" stroke="#4b515c"/><text x="1264" y="348" fill="#eef0f4" font-size="13" font-weight="400">Y  180</text><rect x="1100" y="370" width="144" height="30" rx="4" fill="#2e3239" stroke="#4b515c"/><text x="1110" y="391" fill="#eef0f4" font-size="13" font-weight="400">W  190</text><rect x="1254" y="370" width="158" height="30" rx="4" fill="#2e3239" stroke="#4b515c"/><text x="1264" y="391" fill="#eef0f4" font-size="13" font-weight="400">H  126</text><text x="1100" y="437" fill="#b8bec9" font-size="13" font-weight="400">수정 대상이 바뀌면 이 제목도 바뀜</text><text x="1100" y="463" fill="#b8bec9" font-size="13" font-weight="400">프로젝트 설정은 별도 탭에서 열기</text><rect x="1100" y="517" width="312" height="30" rx="4" fill="#2e3239" stroke="#4b515c"/><text x="1110" y="538" fill="#eef0f4" font-size="13" font-weight="400">프로젝트 설정  /  출력 설정</text><rect x="0" y="586" width="1440" height="46" rx="0" fill="#22252a" stroke="none"/><text x="18" y="615" fill="#eef0f4" font-size="16" font-weight="600">타임라인</text><rect x="128" y="594" width="70" height="30" rx="4" fill="#2e3239" stroke="#4b515c"/><text x="138" y="615" fill="#eef0f4" font-size="13" font-weight="400">선택</text><rect x="208" y="594" width="70" height="30" rx="4" fill="#2e3239" stroke="#4b515c"/><text x="218" y="615" fill="#eef0f4" font-size="13" font-weight="400">분할</text><rect x="288" y="594" width="99" height="30" rx="4" fill="#2e3239" stroke="#4b515c"/><text x="298" y="615" fill="#eef0f4" font-size="13" font-weight="400">리플 삭제</text><text x="413" y="615" fill="#ceb0f3" font-size="13" font-weight="400">그림:  ● 키프레임   ○ 빈 프레임   ─ 유지</text><text x="1150" y="615" fill="#eef0f4" font-size="14" font-weight="400">−   확대  ━━━●━━   +</text><rect x="0" y="632" width="190" height="214" rx="0" fill="#22252a" stroke="none"/><text x="17" y="659" fill="#b8bec9" font-size="13" font-weight="400">레이어 / 대상</text><line x1="190" y1="657" x2="190" y2="846" stroke="#323740" /><text x="193" y="653" fill="#b8bec9" font-size="11" font-weight="400">0F</text><line x1="288" y1="657" x2="288" y2="846" stroke="#323740" /><text x="291" y="653" fill="#b8bec9" font-size="11" font-weight="400">8F</text><line x1="386" y1="657" x2="386" y2="846" stroke="#323740" /><text x="389" y="653" fill="#b8bec9" font-size="11" font-weight="400">16F</text><line x1="484" y1="657" x2="484" y2="846" stroke="#323740" /><text x="487" y="653" fill="#b8bec9" font-size="11" font-weight="400">24F</text><line x1="582" y1="657" x2="582" y2="846" stroke="#323740" /><te