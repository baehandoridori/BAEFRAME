<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">상태 표현 체계 제안</title><desc id="desc">기본, 포커스, 선택, 활성 도구, 저장 중, 저장됨, 오류를 색과 문구와 형태로 함께 구분하는 제안.</desc><style>text{font-family:'Segoe UI','Malgun Gothic',sans-serif}</style><rect x="0" y="0" width="1440" height="900" rx="0" fill="#17191d" stroke="none"/><rect x="0" y="0" width="1440" height="54" rx="0" fill="#31302a" stroke="none"/><text x="24" y="35" fill="#f4cb55" font-size="21" font-weight="600">설계 제안 · 상태를 색 하나에 몰아넣지 않는다</text><rect x="24" y="90" width="330" height="208" rx="6" fill="#22252a" stroke="#4b515c"/><text x="42" y="126" fill="#b8bec9" font-size="20" font-weight="600">기본</text><rect x="42" y="151" width="290" height="62" rx="4" fill="#2e3239" stroke="#b8bec9"/><text x="58" y="188" fill="#b8bec9" font-size="16" font-weight="600">영상 02</text><text x="42" y="255" fill="#b8bec9" font-size="15" font-weight="400">선택하지 않은 항목</text><rect x="376" y="90" width="330" height="208" rx="6" fill="#22252a" stroke="#4b515c"/><text x="394" y="126" fill="#d3d8e1" font-size="20" font-weight="600">가리킴</text><rect x="394" y="151" width="290" height="62" rx="4" fill="#2e3239" stroke="#d3d8e1"/><text x="410" y="188" fill="#d3d8e1" font-size="16" font-weight="600">영상 02</text><text x="394" y="255" fill="#b8bec9" font-size="15" font-weight="400">마우스가 가리키는 항목</text><rect x="728" y="90" width="330" height="208" rx="6" fill="#22252a" stroke="#4b515c"/><text x="746" y="126" fill="#ffffff" font-size="20" font-weight="600">키보드 포커스</text><rect x="746" y="151" width="290" height="62" rx="4" fill="#2e3239" stroke="#ffffff"/><text x="762" y="188" fill="#ffffff" font-size="16" font-weight="600">영상 02</text><text x="746" y="255" fill="#b8bec9" font-size="15" font-weight="400">다음 키 입력을 받는 곳</text><rect x="741" y="146" width="300" height="72" rx="5" fill="none" stroke="#ffffff"/><rect x="1080" y="90" width="330" height="208" rx="6" fill="#22252a" stroke="#4b515c"/><text x="1098" y="126" fill="#8fc0ff" font-size="20" font-weight="600">선택됨</text><rect x="1098" y="151" width="290" height="62" rx="4" fill="#2e3239" stroke="#8fc0ff"/><text x="1114" y="188" fill="#8fc0ff" font-size="16" font-weight="600">✓ 영상 02</text><text x="1098" y="255" fill="#b8bec9" font-size="15" font-weight="400">지금 수정할 대상</text><rect x="1098" y="151" width="4" height="62" rx="0" fill="#8fc0ff" stroke="none"/><rect x="24" y="330" width="330" height="208" rx="6" fill="#22252a" stroke="#4b515c"/><text x="42" y="366" fill="#f4cb55" font-size="20" font-weight="600">활성 도구</text><rect x="42" y="391" width="290" height="62" rx="4" fill="#2e3239" stroke="#f4cb55"/><text x="58" y="428" fill="#f4cb55" font-size="16" font-weight="600">B  펜</text><text x="42" y="495" fill="#b8bec9" font-size="15" font-weight="400">포인터로 수행할 동작</text><rect x="42" y="391" width="4" height="62" rx="0" fill="#f4cb55" stroke="none"/><rect x="376" y="330" width="330" height="208" rx="6" fill="#22252a" stroke="#4b515c"/><text x="394" y="366" fill="#8fc0ff" font-size="20" font-weight="600">저장 중</text><rect x="394" y="391" width="290" height="62" rx="4" fill="#2e3239" stroke="#8fc0ff"/><text x="410" y="428" fill="#8fc0ff" font-size="16" font-weight="600">◌ 저장 중…</text><text x="394" y="495" fill="#b8bec9" font-size="15" font-weight="400">파일에 반영하는 중</text><rect x="728" y="330" width="330" height="208" rx="6" fill="#22252a" stroke="#4b515c"/><text x="746" y="366" fill="#a9d4bc" font-size="20" font-weight="600">저장됨</text><rect x="746" y="391" width="290" height="62" rx="4" fill="#2e3239" stroke="#a9d4bc"/><text x="762" y="428" fill="#a9d4bc" font-size="16" font-weight="600">✓ 이 기기에 저장됨</text><text x="746" y="495" fill="#b8bec9" font-size="15" font-weight="400">현재 기기에 저장 완료</text><rect x="1080" y="330" width="330" height="208" rx="6" fill="#22252a" stroke="#4b515c"/><text x="1098" y="366" fill="#ffaaa3" font-size="20" font-weight="600">실패 / 충돌</text><rect x="1098" y="391" width="290" height="62" rx="4" fill="#2e3239" stroke="#ffaaa3"/><text x="1114" y="428" fill="#ffaaa3" font-size="16" font-weight="600">! 저장 실패 · 다시 시도</text><text x="1098" y="495" fill="#b8bec9" font-size="15" font-weight="400">후속 행동이 필요한 상태</text><rect x="24" y="617" width="1392" height="228" rx="6" fill="#22252a" stroke="none"/><text x="46" y="659" fill="#eef0f4" font-size="23" font-weight="600">신뢰 상태를 나눠서 말하기</text><text x="46" y="704" fill="#f4cb55" font-size="24" font-weight="600">파일에 저장됨  ≠  서버에 연결됨  ≠  상대방에게 전달됨  ≠  현재 버전 검토 완료</text><text x="46" y="752" fill="#b8bec9" font-size="17" font-weight="400">동기화 연결은 저장 성공을 뜻하지 않는다. 각 상태에 시간·대상·재시도 경로를 붙인다.</text><text x="46" y="796" fill="#b8bec9" font-size="15" font-weight="400">이 도식의 문구와 색은 제안이다. 현재 제품이 모든 상태를 제공한다는 뜻이 아니다.</text></svg>