<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">영상과 드로잉 시간축의 관계 제안</title><desc id="desc">영상 정지와 그림 유지, 편집 전체와 선택 컷의 시간을 서로 다른 표식으로 구분하는 제안.</desc><style>text{font-family:'Segoe UI','Malgun Gothic',sans-serif}</style><rect x="0" y="0" width="1440" height="900" rx="0" fill="#17191d" stroke="none"/><rect x="0" y="0" width="1440" height="54" rx="0" fill="#31302a" stroke="none"/><text x="24" y="35" fill="#f4cb55" font-size="21" font-weight="600">설계 제안 · 시간축 문법: 같은 폭의 막대도 무엇이 멈추는지 구분한다</text><text x="24" y="98" fill="#eef0f4" font-size="18" font-weight="600">편집 전체 시간</text><text x="330" y="98" fill="#b8bec9" font-size="14" font-weight="400">0F</text><text x="714" y="98" fill="#b8bec9" font-size="14" font-weight="400">48F</text><text x="1194" y="98" fill="#b8bec9" font-size="14" font-weight="400">108F</text><rect x="330" y="120" width="384" height="60" rx="4" fill="#344d68" stroke="#8fc0ff"/><text x="352" y="155" fill="#eef0f4" font-size="18" font-weight="400">영상 A  ·  48F</text><rect x="714" y="120" width="480" height="60" rx="4" fill="#344d68" stroke="#8fc0ff"/><text x="738" y="155" fill="#eef0f4" font-size="18" font-weight="400">영상 B  ·  60F</text><line x1="906" y1="109" x2="906" y2="521" stroke="#f4cb55" /><text x="918" y="114" fill="#f4cb55" font-size="14" font-weight="400">재생 위치 72F</text><text x="24" y="224" fill="#eef0f4" font-size="18" font-weight="600">선택한 영상 B의 시간</text><text x="714" y="224" fill="#b8bec9" font-size="14" font-weight="400">0F</text><text x="902" y="224" fill="#f4cb55" font-size="14" font-weight="400">24F</text><text x="1194" y="224" fill="#b8bec9" font-size="14" font-weight="400">60F</text><rect x="714" y="248" width="192" height="44" rx="4" fill="#4b4059" stroke="#ceb0f3"/><circle cx="726" cy="270" r="6" fill="#ceb0f3" stroke="none"/><text x="745" y="277" fill="#eef0f4" font-size="15" font-weight="400">그림 1 유지</text><rect x="906" y="248" width="64" height="44" rx="4" fill="#4b4059" stroke="#ceb0f3"/><circle cx="918" cy="270" r="6" fill="#ceb0f3" stroke="none"/><circle cx="980" cy="270" r="6" fill="#17191d" stroke="#ceb0f3"/><text x="998" y="277" fill="#ceb0f3" font-size="15" font-weight="400">여기부터 빈 그림</text><text x="24" y="281" fill="#ceb0f3" font-size="17" font-weight="400">포즈 레이어</text><text x="24" y="357" fill="#eef0f4" font-size="18" font-weight="600">영상의 정지 구간</text><rect x="714" y="326" width="256" height="64" rx="4" fill="#354858" stroke="#8fc0ff"/><text x="734" y="363" fill="#8fc0ff" font-size="16" font-weight="400">Ⅱ 영상 정지 · 원본 24F 고정</text><text x="24" y="443" fill="#eef0f4" font-size="18" font-weight="600">드로잉 유지 구간</text><rect x="714" y="412" width="256" height="64" rx="4" fill="#4b4059" stroke="#ceb0f3"/><text x="734" y="449" fill="#ceb0f3" font-size="15" font-weight="400">●──── 같은 그림을 이어 표시</text><text x="650" y="522" fill="#8fc0ff" font-size="17" font-weight="600">영상 정지: 원본 프레임 고정, 편집 시간은 진행</text><text x="650" y="553" fill="#ceb0f3" font-size="17" font-weight="600">그림 유지: 그림이 같아도 영상은 재생될 수 있음</text><rect x="24" y="594" width="1392" height="252" rx="8" fill="#22252a" stroke="none"/><text x="48" y="636" fill="#eef0f4" font-size="23" font-weight="600">겹쳐 보여도 합쳐 버리지 않을 것</text><text x="48" y="680" fill="#f4cb55" font-size="16" font-weight="600">시간 기준</text><text x="180" y="680" fill="#eef0f4" font-size="16" font-weight="400">상단의 편집 시간과 선택 컷 안의 시간을 함께 읽을 수 있어야 한다.</text><text x="48" y="724" fill="#f4cb55" font-size="16" font-weight="600">공간 규칙</text><text x="180" y="724" fill="#eef0f4" font-size="16" font-weight="400">그림 프레임은 선택한 컷 아래에만 펼친다. 가로 눈금은 같은 시간에 정렬한다.</text><text x="48" y="768" fill="#f4cb55" font-size="16" font-weight="600">표식 규칙</text><text x="180" y="768" fill="#eef0f4" font-size="16" font-weight="400">영상 정지는 Ⅱ, 그림 시작은 ●, 빈 키프레임은 ○, 유지 구간은 선/띠로 표현한다.</text><text x="48" y="812" fill="#f4cb55" font-size="16" font-weight="600">검증할 상황</text><text x="180" y="812" fill="#eef0f4" font-size="16" font-weight="400">서로 다른 FPS, 자르기, 정지 삽입, 컷 재배치, 확대 후에도 의미가 바뀌지 않아야 한다.</text></svg>