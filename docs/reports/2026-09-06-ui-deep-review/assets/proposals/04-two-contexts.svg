<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">리뷰와 제작의 공통 구조와 다른 문맥</title><desc id="desc">별도 창과 저장 형식을 유지하면서 공통 구조를 통일하고 오른쪽 문맥만 달리하는 단계적 제안.</desc><style>text{font-family:'Segoe UI','Malgun Gothic',sans-serif}</style><rect x="0" y="0" width="1440" height="900" rx="0" fill="#17191d" stroke="none"/><rect x="0" y="0" width="1440" height="54" rx="0" fill="#31302a" stroke="none"/><text x="24" y="35" fill="#f4cb55" font-size="21" font-weight="600">설계 제안 · 리뷰는 댓글에, 제작은 선택 속성에 오른쪽 공간을 쓴다</text><text x="24" y="101" fill="#eef0f4" font-size="24" font-weight="600">리뷰 작업</text><rect x="24" y="123" width="682" height="537" rx="6" fill="#22252a" stroke="#4b515c"/><rect x="40" y="141" width="414" height="250" rx="0" fill="#101216" stroke="none"/><text x="163" y="271" fill="#b8bec9" font-size="19" font-weight="400">영상 미리보기</text><rect x="469" y="141" width="221" height="461" rx="0" fill="#2e3239" stroke="none"/><text x="483" y="174" fill="#eef0f4" font-size="15" font-weight="600">댓글 · 현재 버전 v03</text><path d="M469 190H690" stroke="#4b515c"/><text x="483" y="222" fill="#8fc0ff" font-size="14" font-weight="400">48F  /  02:00</text><text x="483" y="254" fill="#eef0f4" font-size="13" font-weight="400">손 끝이 너무 빨리 꺾입니다.</text><text x="483" y="286" fill="#b8bec9" font-size="13" font-weight="400">미해결 · 그림 1개 연결</text><rect x="483" y="321" width="191" height="30" rx="4" fill="#2e3239" stroke="#4b515c"/><text x="493" y="342" fill="#eef0f4" font-size="13" font-weight="400">답글 / 해결 표시</text><rect x="40" y="410" width="414" height="39" rx="0" fill="#2e3239" stroke="none"/><text x="52" y="435" fill="#eef0f4" font-size="14" font-weight="400">공통: 재생 · 시간 · 배율</text><rect x="40" y="469" width="414" height="133" rx="0" fill="#332e3c" stroke="none"/><text x="52" y="506" fill="#ceb0f3" font-size="16" font-weight="400">댓글 위치 + 드로잉 프레임</text><text x="44" y="639" fill="#b8bec9" font-size="14" font-weight="400">리뷰 파일: 원본에 대한 피드백</text><text x="730" y="101" fill="#eef0f4" font-size="24" font-weight="600">영상 제작</text><rect x="730" y="123" width="682" height="537" rx="6" fill="#22252a" stroke="#4b515c"/><rect x="746" y="141" width="414" height="250" rx="0" fill="#101216" stroke="none"/><text x="869" y="271" fill="#b8bec9" font-size="19" font-weight="400">영상 미리보기</text><rect x="1175" y="141" width="221" height="461" rx="0" fill="#2e3239" stroke="none"/><text x="1189" y="174" fill="#eef0f4" font-size="15" font-weight="600">선택 속성 · 컷 02</text><path d="M1175 190H1396" stroke="#4b515c"/><text x="1189" y="222" fill="#8fc0ff" font-size="14" font-weight="400">선택한 그림 2개</text><text x="1189" y="254" fill="#eef0f4" font-size="13" font-weight="400">변경 범위: 이 키프레임</text><text x="1189" y="286" fill="#b8bec9" font-size="13" font-weight="400">출력에 포함 · 포즈 레이어</text><rect x="1189" y="321" width="191" height="30" rx="4" fill="#2e3239" stroke="#4b515c"/><text x="1199" y="342" fill="#eef0f4" font-size="13" font-weight="400">정렬 / 변형 / 범위</text><rect x="746" y="410" width="414" height="39" rx="0" fill="#2e3239" stroke="none"/><text x="758" y="435" fill="#eef0f4" font-size="14" font-weight="400">공통: 재생 · 시간 · 배율</text><rect x="746" y="469" width="414" height="133" rx="0" fill="#332e3c" stroke="none"/><text x="758" y="506" fill="#ceb0f3" font-size="16" font-weight="400">영상 컷 + 펼친 드로잉 프레임</text><text x="750" y="639" fill="#b8bec9" font-size="14" font-weight="400">편집 파일: 완성 영상의 구성</text><text x="24" y="728" fill="#f4cb55" font-size="20" font-weight="600">1단계 권고</text><text x="220" y="728" fill="#eef0f4" font-size="21" font-weight="400">두 창을 유지해도 위치·도구·문구·상태 규칙부터 통일한다.</text><text x="220" y="772" fill="#b8bec9" font-size="18" font-weight="400">한 파일 형식이나 한 창으로 합치는 것은 별도 제품 결정이다.</text><text x="220" y="814" fill="#b8bec9" font-size="18" font-weight="400">서로 다른 저장 모델을 시각적으로 연결하되, 저장 대상은 계속 드러낸다.</text></svg>